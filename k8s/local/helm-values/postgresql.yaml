# bitnami/postgresql, single instance - matches docker-compose.dev.yml's
# credentials/database so app config doesn't differ between the two
# local dev loops.
image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: "16-debian-12"

global:
  security:
    allowInsecureImages: true

auth:
  username: matchflow
  password: matchflow
  database: matchflow

primary:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

metrics:
  enabled: false
